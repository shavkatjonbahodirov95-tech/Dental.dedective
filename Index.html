<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dental Detective</title>
<style>
:root{--bg:#eef5fc;--card:#fff;--ink:#0b2a4a;--pri:#0b4f8f;--acc:#3aa0e8;--ok:#1b9e5a;--no:#d6453d;--mut:#5b7087;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a2e;--card:#12304f;--ink:#e8f2fc;--pri:#5fb3f5;--mut:#9db4cc}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 4px 18px rgba(11,79,143,.12);margin-bottom:12px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h1{margin:0;font-size:28px;letter-spacing:1px;color:var(--pri)}h2{margin:0 0 8px;font-size:19px}
p{line-height:1.5;margin:6px 0}.mut{color:var(--mut);font-size:14px}
button,input{font:inherit}
.btn{display:block;width:100%;padding:14px;margin-top:9px;border:2px solid var(--acc);border-radius:12px;background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.btn.main{background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-weight:700}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.no{background:var(--no);border-color:var(--no);color:#fff}
input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--acc);background:var(--card);color:var(--ink);margin-top:10px}
.bar{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--pri)}
.tm{height:6px;background:#bcd7ef;border-radius:3px;margin:8px 0;overflow:hidden}.tm i{display:block;height:100%;background:var(--acc);width:100%}
.imgs{display:flex;gap:8px;justify-content:center;margin:8px 0}.imgs figure{margin:0;flex:1;background:#f4f9ff;border-radius:12px;padding:6px;text-align:center}
.imgs svg{width:100%;height:auto}.imgs img{width:100%;height:auto;max-height:190px;object-fit:contain;border-radius:8px;background:#fff}.imgs figcaption{font-size:13px;color:#0b2a4a;font-weight:700}
.fb{margin-top:10px;padding:12px;border-radius:12px;background:rgba(58,160,232,.14);font-size:15px;line-height:1.45}
.tag{display:inline-block;background:var(--pri);color:#fff;border-radius:20px;padding:3px 10px;font-size:12px}
li{margin:4px 0}
</style></head><body><div id="app"></div>

const S3=[["eksk","Kariyes kovagidagi yumshagan dentinni olib tashlash uchun qaysi asbob ishlatiladi?"],["emal","Kovak chetidagi emalni tekislash va ishlov berish uchun qaysi asbob qo‘llanadi?"],["gladil","Plomba yuzasini tekislash va pardozlash uchun qaysi asbob kerak?"],["ilgak","Tish yuzasidagi tish toshlarini olib tashlashda qaysi asbob ishlatiladi?"],["pinset","Paxta bo‘lagini og‘iz bo‘shlig‘iga olib kirish va olish uchun qaysi asbob qulay?"],["kozgu","Qiyin ko‘rinadigan tish yuzasini ko‘rish va tilni chetlatish uchun qaysi asbob ishlatiladi?"],["ashtof","Amalgamani kovakka zichlab joylash uchun qaysi asbob tanlanadi?"],["skalpel","Jarrohlikda yumshoq to‘qimani kesish uchun qaysi asbob ishlatiladi?"]];
const S4=[
{im:["bzond","tzond"],q:"Qaysi zondning ishchi qismi tutqichga nisbatan burchak ostida egilgan?",o:["Burchakli zond","To‘g‘ri zond"],a:"Burchakli zond",ex:"Burchakli zond egilgan uchi bilan qiyin joylarga yetadi; to‘g‘ri zond ingichka va to‘g‘ri uchli."},
{im:["tshtof","ashtof"],q:"Qaysi shtoferning ishchi uchi yassi, to‘rtburchak maydonchali?",o:["Tugmasimon shtofer","Amalgama uchun shtofer"],a:"Amalgama uchun shtofer",ex:"Tugmasimon shtoferning uchi tugmacha (shar) shaklida; amalgama uchun shtoferniki yassi maydoncha."},
{im:["pinset","xpinset"],q:"Qaysi pinset jarrohlikda to‘qimalarni ushlab turish uchun mo‘ljallangan?",o:["Stomatologik pinset","Xirurgik pinset"],a:"Xirurgik pinset",ex:"Stomatologik pinset ko‘rik va davolashda materialni olib beradi; xirurgik pinset jarrohlikda to‘qimani ushlaydi."},
{im:["gladil","tshtof"],q:"Qaysi asbob plomba yuzasini tekislash va shakllantirish (pardozlash) uchun ishlatiladi?",o:["Gladilka","Tugmasimon shtofer"],a:"Gladilka",ex:"Gladilka yuzani tekislaydi va shakllantiradi; tugmasimon shtofer materialni kovakka zichlaydi."},
{im:["eksk","ilgak"],q:"Qaysi asbob kariyes kovagidagi yumshagan dentinni olib tashlaydi?",o:["Ekskavator","Tish toshi ilgagi"],a:"Ekskavator",ex:"Ilgak tish yuzasidagi qattiq tish toshlarini oladi; ekskavator kovakdagi yumshagan dentinni."}];
let G;
function mk1(x){const o=I.filter(a=>a!==x).sort((a,b)=>((a[4]==x[4]?0:1)-(b[4]==x[4]?0:1))||Math.random()-.5).slice(0,3).map(a=>a[1]);return{im:[x[0]],q:"Bu asbobning to‘g‘ri nomi qaysi?",o:sh([x[1],...o]),a:x[1],ex:x[1]+" — "+x[3]+".",p:10,topic:"Asboblar nomi"}}
function mk2(x){const c=D[x[2]],o=sh(D.filter(d=>d!=c)).slice(0,3);return{im:[x[0]],q:"«"+x[1]+"»qaysi guruhga kiradi (vazifasi bo‘yicha)?",o:sh([c,...o]),a:c,ex:x[1]+" — "+x[3]+". Guruh: "+c+".",p:10,topic:"Vazifa guruhlari bo‘yicha tasnif"}}
function mk3(s){const x=I.find(a=>a[0]==s[0]);const o=sh(I.filter(a=>a!==x).sort((a,b)=>(a[4]==x[4]?-1:1)+Math.random()-.5).slice(0,3).map(a=>a[1]));return{im:[],q:s[1],o:sh([x[1],...o]),a:x[1],ex:x[1]+" — "+x[3]+".",p:10,topic:"Klinik vaziyatlar"}}
function mk4(s){return{im:s.im,q:s.q,o:s.o,a:s.a,ex:s.ex,p:15,topic:"O‘xshash asboblarni farqlash"}}
function build(){const p1=sh(I).slice(0,6).map(mk1),p2=sh(I).slice(0,5).map(mk2),p3=sh(S3).slice(0,6).map(mk3),p4=sh(S4).map(mk4);
const pool=sh([...sh(I).slice(0,5).map(mk1),...sh(I).slice(0,4).map(mk2),...sh(S3).slice(0,4).map(mk3),...sh(S4).slice(0,3).map(mk4)]).slice(0,10);return[p1,p2,p3,p4,pool]}
function home(){let last="";try{const r=JSON.parse(localStorage.getItem("dd_last")||"null");if(r)last=`<p class="mut">Oxirgi natija: ${r.name||"Ismsiz"} — ${r.score} ball (${r.pct}%)</p>`}catch(e){}
$.innerHTML=`<div class="card"><h1>DENTAL DETECTIVE</h1><p><b>Stomatologik asboblar sirlari</b></p><p>Stomatologik asboblarni taniy olasizmi? Rasmlarni tahlil qiling, ularning vazifalarini aniqlang va qaysi bo‘limga tegishli ekanini toping!</p>
<input id="nm" placeholder="Ismingiz (ixtiyoriy)" maxlength="30"><button class="btn main" onclick="start()">O‘yinni boshlash</button>${last}</div>
<div class="card"><h2>Qoidalar</h2><ul><li>5 ta bosqich, jami 32 ta savol</li><li>To‘g‘ri javob +10, qiyin taqqoslash +15 ball</li><li>Ketma-ket to‘g‘ri javoblar uchun bonus (+2 dan boshlab)</li><li>5-bosqichda tezlik bonusi; taxminiy umumiy vaqt: 10–12 daqiqa</li><li>Noto‘g‘ri javob 0 ball, ball manfiy bo‘lmaydi</li></ul><p class="mut">Rasmlar darslikdagi «Stomatologiya asboblari» jadvalidan; o‘yin internetsiz ishlaydi.</p></div>`}
function start(){G={name:document.getElementById("nm").value.trim(),st:0,i:0,score:0,ok:0,tot:0,streak:0,miss:{},Q:build()};intro()}
function intro(){$.innerHTML=`<div class="card"><span class="tag">${G.st+1}-bosqich / 5</span><h2 style="margin-top:8px">${T[G.st]}</h2><p>${TD[G.st]}</p><p class="mut">Savollar soni: ${G.Q[G.st].length}</p><button class="btn main" onclick="ask()">Boshlash</button></div>`}
let tmr,left;
function ask(){clearInterval(tmr);const q=G.Q[G.st][G.i];G.cur=q;G.done=false;
const imgs=q.im.length?`<div class="imgs">${q.im.map(id=>`<figure>${svg(id)}${G.st==0||G.st==1?"":`<figcaption>${nm(id)}</figcaption>`}</figure>`).join("")}</div>`:"";
$.innerHTML=`<div class="card"><div class="bar"><span>${G.st+1}-bosqich · ${G.i+1}/${G.Q[G.st].length}</span><span>Ball: ${G.score} · 🔥${G.streak}</span></div>${G.st==4?'<div class="tm"><i id="tb"></i></div>':""}${imgs}<h2>${q.q}</h2><div id="o">${q.o.map((t,k)=>`<button class="btn" onclick="pick(${k})">${t}</button>`).join("")}</div><div id="fb"></div></div>`;
if(G.st==4){left=20;const t0=Date.now();tmr=setInterval(()=>{left=20-(Date.now()-t0)/1000;const b=document.getElementById("tb");if(b)b.style.width=Math.max(0,left/20*100)+"%";if(left<=0){clearInterval(tmr);pick(-1)}},100)}}
function pick(k){if(G.done)return;G.done=true;clearInterval(tmr);const q=G.cur,good=k>=0&&q.o[k]==q.a;G.tot++;let add=0,note="";
if(good){G.ok++;G.streak++;add=q.p;if(G.st==4)add+=Math.floor(left/5);if(G.streak>=3)add+=Math.min(10,2*(G.streak-2));G.score+=add}else{G.streak=0;G.miss[q.topic]=(G.miss[q.topic]||0)+1;}
[...document.querySelectorAll("#o .btn")].forEach((b,j)=>{b.disabled=true;if(q.o[j]==q.a)b.classList.add("ok");else if(j==k)b.classList.add("no")});
const head=k<0?"⏱ Vaqt tugadi.":good?`✅ To‘g‘ri! +${add} ball`:"❌ Noto‘g‘ri. 0 ball.";
const why=good?"":" To‘g‘ri javob: <b>"+q.a+"</b>."+(k>=0?" Siz tanlagan «"+q.o[k]+"» boshqa vazifaga ega, shuning uchun tanlov mos kelmaydi.":"");
const last=G.i+1>=G.Q[G.st].length&&G.st==4;
document.getElementById("fb").innerHTML=`<div class="fb"><b>${head}</b>${why}<br>${q.ex}</div><button class="btn main" onclick="next()">${last?"Natijalarni ko‘rish":"Keyingisi"}</button>`}
function next(){G.i++;if(G.i>=G.Q[G.st].length){G.st++;G.i=0;if(G.st>4)return result();return intro()}ask()}
function result(){const pct=Math.round(G.ok/G.tot*100);const lv=pct>=90?"Stomatologik asboblar eksperti":pct>=75?"Malakali asbobshunos":pct>=50?"Yosh stomatolog":"Bilimlarni yana mustahkamlash kerak";
const m=Object.keys(G.miss);try{localStorage.setItem("dd_last",JSON.stringify({name:G.name,score:G.score,pct}))}catch(e){}
$.innerHTML=`<div class="card"><span class="tag">Yakuniy natija</span><h1 style="margin-top:8px">${pct}%</h1><h2>${lv}</h2><p>${G.name?G.name+", ":""}siz ${G.tot} ta savoldan ${G.ok} tasiga to‘g‘ri javob berdingiz va <b>${G.score}</b> ball to‘pladingiz.</p>
<p><b>Mustahkam bilimlar:</b> ${m.length<4?"asboblarning nomi va vazifalari bo‘yicha yaxshi natija":"ayrim mavzular"}.</p><p><b>Qayta ko‘rib chiqish kerak:</b> ${m.length?m.map(t=>t+" ("+G.miss[t]+")").join(", "):"xatolar yo‘q — ajoyib!"}</p>
<button class="btn main" onclick="start()">Qayta boshlash</button><button class="btn" onclick="home()">Bosh sahifa</button></div>`}
home();
</script></body></html>
